name: publish

# Publish dsh-searxng-search to npm via npm trusted publishing (OIDC).
# Mirrors the official example: https://docs.npmjs.com/trusted-publishers/
#
# No npm token is used. The job's `id-token: write` permission lets the npm
# CLI exchange the GitHub Actions OIDC token with the registry; npmjs.com
# authorizes this repository under Access Tokens → Trusted publishing
# (workflow filename: publish.yml).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Pack and validate tarball
        run: npm pack --dry-run

      - name: Publish to npm (OIDC, no token)
        if: ${{ !inputs.dry_run }}
        run: npm publish

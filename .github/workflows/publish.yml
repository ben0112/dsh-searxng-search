name: publish

# Publish dsh-searxng-search to npm via npm trusted publishing (OIDC).
#
# No npm token is used: the job's `id-token: write` permission lets npm's CLI
# exchange the GitHub Actions OIDC token with the registry, and npmjs.com
# authorizes this repository (owner/repo must be registered under
# npmjs.com → Access Tokens → Trusted publishing).
#
# Triggers:
#   - push a version tag (e.g. `v0.1.2` after bumping package.json) →
#     validates tag == package.json version, then publishes with provenance
#   - manual `workflow_dispatch` run with "dry_run" checked → packs and
#     validates the tarball WITHOUT publishing (CI smoke test)
#
# lib/ is committed to this repo (built with `pnpm build`), so the publish
# job does not need a harness checkout or the @deepseek-ai types to compile.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Pack and validate tarball
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing)
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
